<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Rythme</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f4bff">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eceff4;--ink:#1b2540;--mute:#5d6783;--acc:#2f4bff;--on:#ff5a36;--cell:#d5dbe7;--card:#f8f9fc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11172a;--ink:#e7ebf7;--mute:#98a2c0;--acc:#7f93ff;--on:#ff7a59;--cell:#232c48;--card:#182036;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11172a;--ink:#e7ebf7;--mute:#98a2c0;--acc:#7f93ff;--on:#ff7a59;--cell:#232c48;--card:#182036;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Space Grotesk",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:22px 16px 48px}
h1{font:700 clamp(1.8rem,6vw,2.6rem)/1.05 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.02em;margin:4px 0 14px}
h2{font-size:1.05rem;margin:18px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button,select{font:inherit;border-radius:10px;border:0;padding:10px 16px;cursor:pointer}
button{font-weight:600;background:var(--acc);color:#fff}
button.alt,select{background:var(--cell);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;overflow-x:auto}
.tr{display:grid;grid-template-columns:78px repeat(16,1fr);gap:4px;margin-bottom:5px;min-width:520px;align-items:center}
.tr>span{font-size:.88rem;color:var(--mute)}
.tr>span button{padding:2px 8px;font-size:.85rem;background:transparent;color:var(--ink);border:2px solid var(--cell)}
.tr>span button.m{opacity:.4;text-decoration:line-through}
.c{height:32px;padding:0;border-radius:5px;background:var(--cell)}
.c.a{background:var(--acc)}
.c.a2{background:var(--acc);box-shadow:inset 0 -12px 0 rgba(255,255,255,.5)}
.c.cur{outline:2px solid var(--on);outline-offset:1px}
.c.a.cur,.c.a2.cur{background:var(--on)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 18px}
.ctl label{display:flex;flex-direction:column;font-size:.9rem;color:var(--mute);gap:2px}
.ctl output{color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--cell);color:var(--ink);padding:8px 14px}
.tabs button.on{background:var(--acc);color:#fff}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Studio Rythme</h1>
<div class="row">
<button id="play">Lecture</button>
<select id="pre" aria-label="Pattern de départ"><option value="classic">Classic</option><option value="deep">Deep</option><option value="tech">Tech house</option><option value="electro">Electro</option></select>
<button id="rnd" class="alt">Aléatoire</button>
<button id="clr" class="alt">Vider</button>
<button id="sav" class="alt">Sauvegarder</button>
<button id="opn" class="alt">Ouvrir</button>
<input type="file" id="fo" accept=".json" hidden>
</div>

<h2>Pattern (1 mesure en boucle)</h2>
<div class="card">
<p class="hint">Un clic : note. Deux clics : note accentuée. Trois : éteinte.</p>
<div id="gp"></div>
</div>

<h2>Transition</h2>
<div class="card">
<div class="row">
<button id="pf" class="alt">Proposer une transition</button>
<button id="af">Jouer la transition</button>
<select id="auto" aria-label="Transition automatique"><option value="0">Auto : aucune</option><option value="2">Auto : 1 mesure sur 2</option><option value="4" selected>Auto : 1 mesure sur 4</option><option value="8">Auto : 1 mesure sur 8</option></select>
</div>
<p class="hint" id="fn"></p>
<div id="gf"></div>
</div>

<h2>Sons et modulation</h2>
<div class="card">
<div class="tabs" id="tabs"></div>
<div id="pan"></div>
<div class="row" style="margin:14px 0 0">
<button class="alt" id="prv">Écouter</button>
<button class="alt" id="prand">Son aléatoire</button>
<button class="alt" id="prst">Réinitialiser ce son</button>
</div>
</div>

<h2>Mix général</h2>
<div class="card ctl">
<label>Tempo <output id="o-bpm"></output><input type="range" id="bpm" min="90" max="150" value="124"></label>
<label>Swing <output id="o-sw"></output><input type="range" id="sw" min="0" max="40" value="10"></label>
<label>Volume <output id="o-vol"></output><input type="range" id="vol" min="0" max="100" value="80"></label>
</div>

<h2>Export pour Ableton</h2>
<div class="row">
<button id="exp" class="alt">Exporter 4 mesures</button>
<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="xw" checked> WAV (une piste par instrument)</label>
<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="xm" checked> MIDI</label>
</div>
<p class="hint">L’export fait 4 mesures : 3 mesures du pattern, puis la transition.</p>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var DR=[['kick','Kick'],['clap','Clap'],['ch','Hat'],['oh','Hat ouvert'],['sh','Shaker']];
var NM={kick:'kick',clap:'clap',ch:'hat',oh:'hat-ouvert',sh:'shaker'};
var PRE={
classic:{kick:'x...x...x...x...',clap:'....X.......x...',ch:'x.x.x.x.x.x.x.x.',oh:'..x...x...x...X.',sh:'.x.x.x.x.x.x.x.x'},
deep:{kick:'x...x...x...x...',clap:'....x.......x...',ch:'..x...x...x...x.',oh:'..x...x...x...x.',sh:'x.xxx.xxx.xxx.xx'},
tech:{kick:'x...x...x...x...',clap:'....x.......x..x',ch:'xxxxxxxxxxxxxxxx',oh:'..x...x...x...X.',sh:'..x...x...x...x.'},
electro:{kick:'X..x..x...x..x..',clap:'....x.......x...',ch:'x.x.x.x.x.x.x.x.',oh:'......x.......X.',sh:'..x...x...x...x.'}};
// [clé, nom, min, max, défaut, unité, pas]  ou  [clé, nom, 'sel', options, défaut]
var DEF={
kick:[['tune','Grave',35,75,48,'Hz'],['punch','Attaque du pitch',80,350,165,'Hz'],['sweep','Chute du pitch',20,250,100,'ms'],['decay','Durée',120,900,320,'ms'],['click','Click',0,100,0,'%'],['drive','Saturation',0,100,0,'%'],['lvl','Niveau',0,100,100,'%']],
clap:[['tone','Ton',700,3500,1300,'Hz'],['q','Résonance',0.5,8,1.2,'',0.1],['decay','Durée',60,500,160,'ms'],['spread','Écart des frappes',6,40,12,'ms'],['lvl','Niveau',0,100,55,'%']],
ch:[['pitch','Hauteur du métal',50,160,100,'%'],['tone','Brillance',4000,11000,7000,'Hz'],['decay','Durée',15,200,50,'ms'],['lvl','Niveau',0,100,70,'%']],
oh:[['pitch','Hauteur du métal',50,160,100,'%'],['tone','Brillance',4000,11000,7000,'Hz'],['decay','Durée',120,1000,380,'ms'],['lvl','Niveau',0,100,90,'%']],
sh:[['tone','Ton',2000,10000,6500,'Hz'],['q','Résonance',0.5,8,0.8,'',0.1],['decay','Durée',15,150,45,'ms'],['lvl','Niveau',0,100,70,'%']],
mod:[['rate','Vitesse du LFO',0.05,6,0.25,'Hz',0.05],['shape','Forme du LFO','sel',['Sinus','Triangle','Carré','Aléatoire'],0],['kd','LFO → grave du kick',0,100,0,'%'],['cd','LFO → ton du clap',0,100,0,'%'],['hd','LFO → brillance du hat',0,100,0,'%'],['od','LFO → brillance du hat ouvert',0,100,0,'%'],['shd','LFO → ton du shaker',0,100,0,'%'],['acc','Force des accents',0,100,60,'%'],['hum','Humanisation',0,100,0,'%']]};
var TABN={kick:'Kick',clap:'Clap',ch:'Hat',oh:'Hat ouvert',sh:'Shaker',mod:'Modulation'};
var P={},F={},K={},mute={},cur='kick',ctx,G,timer,playing=false,next=0,step=0,barNum=0,curPat=null,curFill=false,armed=false,fillIdx=-1,cols={p:[],f:[]},lastCells=[];
Object.keys(DEF).forEach(function(n){K[n]={};DEF[n].forEach(function(d){K[n][d[0]]=d[4]})});
function p(n,k){return K[n][k]}
function sdur(){return 60/$('#bpm').value/4}
function parse(s){return s.split('').map(function(c){return c==='X'?2:(c==='x'?1:0)})}

/* ---------- moteur audio (léger) ---------- */
function lf(t){var r=p('mod','rate'),s=p('mod','shape'),ph=(t*r)%1;if(s===0)return Math.sin(2*Math.PI*ph);if(s===1)return 4*Math.abs(ph-.5)-1;if(s===2)return ph<.5?1:-1;var x=Math.sin(Math.floor(t*r)*12.9898)*43758.5453;return (x-Math.floor(x))*2-1}
function jit(t,k,d){return d?((Math.sin(t*12.9898+k.charCodeAt(0)*78.233+k.charCodeAt(1)*37.7)*43758.5453)%1+1)%1:Math.random()}
function mk(c,raw){var m=c.createGain();m.gain.value=$('#vol').value/100;
 if(raw)m.connect(c.destination);else{var w=c.createWaveShaper(),a=new Float32Array(1024),i;for(i=0;i<1024;i++){var x=i/512-1;a[i]=Math.tanh(1.4*x)/Math.tanh(1.4)}w.curve=a;m.connect(w);w.connect(c.destination)}
 var nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(var j=0;j<d.length;j++)d[j]=Math.random()*2-1;
 return{ctx:c,master:m,noise:nb,hat:{}}}
function env(g,t,a,dec,pk){pk=Math.max(pk,.0001);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.001,t+a+dec)}
function nz(g,t,type,f,q,dec,pk){var n=g.ctx.createBufferSource();n.buffer=g.noise;var fl=g.ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;var v=g.ctx.createGain();env(v,t,.001,dec,pk);n.connect(fl);fl.connect(v);v.connect(g.master);n.start(t);n.stop(t+dec+.05)}
function curve(d){var k=d/100*25,a=new Float32Array(512);for(var i=0;i<512;i++){var x=i/256-1;a[i]=(1+k)*x/(1+k*Math.abs(x))}return a}
function kick(g,t,v){var c=g.ctx,o=c.createOscillator(),e=c.createGain(),dc=p('kick','decay')/1000,km=Math.pow(2,lf(t)*p('mod','kd')/100*.6);
 o.frequency.setValueAtTime(p('kick','punch')*km,t);o.frequency.exponentialRampToValueAtTime(p('kick','tune')*km,t+p('kick','sweep')/1000);
 env(e,t,.002,dc,p('kick','lvl')/100*v);o.connect(e);
 if(p('kick','drive')>0){var w=c.createWaveShaper();w.curve=curve(p('kick','drive'));e.connect(w);w.connect(g.master)}else e.connect(g.master);
 if(p('kick','click')>0)nz(g,t,'highpass',2500,.7,.012,p('kick','click')/100*.6*v);
 o.start(t);o.stop(t+dc+.1)}
function clap(g,t,v){var s=p('clap','spread')/1000,dc=p('clap','decay')/1000,tn=p('clap','tone')*Math.pow(2,lf(t)*p('mod','cd')/100*1.5);
 [0,s,2*s].forEach(function(o,i){nz(g,t+o,'bandpass',tn,p('clap','q'),i===2?dc:.02,p('clap','lvl')/100*v)})}
var MF=[263,400,421,474,587,845];
function chain(g){var c=g.ctx,bp=c.createBiquadFilter(),hp=c.createBiquadFilter(),v=c.createGain(),os=[];
 bp.type='bandpass';bp.Q.value=.6;hp.type='highpass';v.gain.value=0;
 MF.forEach(function(f){var o=c.createOscillator(),q=c.createGain();o.type='square';o.frequency.value=f;q.gain.value=.25;o.connect(q);q.connect(bp);o.start();os.push(o)});
 bp.connect(hp);hp.connect(v);v.connect(g.master);return{bp:bp,hp:hp,v:v,os:os}}
function metal(g,t,open,vel){var n=open?'oh':'ch',h=g.hat[n]||(g.hat[n]=chain(g)),dec=Math.max(p(n,'decay')/1000,.08),pk=Math.max(p(n,'lvl')/200*vel,.0001),pt=p(n,'pitch')/100,tn=Math.min(12000,p(n,'tone')*Math.pow(2,lf(t)*p('mod',open?'od':'hd')/100*.8));
 h.bp.frequency.setValueAtTime(tn*1.4,t);h.hp.frequency.setValueAtTime(tn,t);
 h.os.forEach(function(o,i){o.frequency.setValueAtTime(MF[i]*pt,t)});
 var gn=h.v.gain;gn.cancelScheduledValues(t);gn.setValueAtTime(0,t);gn.linearRampToValueAtTime(pk,t+.002);
 if(open)gn.exponentialRampToValueAtTime(Math.max(pk*.4,.0001),t+.07);
 gn.exponentialRampToValueAtTime(.001,t+dec);gn.setValueAtTime(0,t+dec+.01);
 nz(g,t,'highpass',tn+2000,.7,dec*.8,pk*.25)}
function hit(g,t,k,v){
 if(k==='kick')kick(g,t,v);
 else if(k==='clap')clap(g,t,v);
 else if(k==='ch'){var o=g.hat.oh;if(o){o.v.gain.cancelScheduledValues(t);o.v.gain.setTargetAtTime(0,t,.004)}metal(g,t,false,v)}
 else if(k==='oh')metal(g,t,true,v);
 else nz(g,t,'bandpass',Math.min(12000,p('sh','tone')*Math.pow(2,lf(t)*p('mod','shd')/100*1.2)),p('sh','q'),p('sh','decay')/1000,p('sh','lvl')/350*v)}
function playStep(g,t,si,pat){var H=p('mod','hum')/100,A=1+p('mod','acc')/100*.6;
 DR.forEach(function(tr){var k=tr[0],st=pat[k][si];if(!st)return;if(g.only?g.only!==k:mute[k])return;
  hit(g,k==='kick'?t:t+jit(t,k,g.det)*H*.015,k,st===2?A:1)})}

/* ---------- grilles ---------- */
function gridHtml(id,withMute){var h='';DR.forEach(function(t){h+='<div class="tr"><span>'+(withMute?'<button data-m="'+t[0]+'" title="Couper ou remettre">'+t[1]+'</button>':t[1])+'</span>';for(var i=0;i<16;i++)h+='<button class="c" data-g="'+id+'" data-t="'+t[0]+'" data-i="'+i+'" aria-label="'+t[1]+' temps '+(i+1)+'"></button>';h+='</div>'});return h}
function build(){
 $('#gp').innerHTML=gridHtml('p',true);$('#gf').innerHTML=gridHtml('f',false);
 ['p','f'].forEach(function(id){for(var i=0;i<16;i++)cols[id][i]=[];document.querySelectorAll('#g'+id+' .c').forEach(function(b){cols[id][+b.dataset.i].push(b)})});
 var click=function(e){var b=e.target;
  if(b.dataset.m){mute[b.dataset.m]=!mute[b.dataset.m];b.classList.toggle('m',!!mute[b.dataset.m]);return}
  if(b.dataset.t){var S=b.dataset.g==='p'?P:F,t=b.dataset.t,i=+b.dataset.i;S[t][i]=(S[t][i]+1)%3;paint();if(S[t][i]&&!playing)aud(t,S[t][i]===2?1.4:1)}};
 $('#gp').onclick=click;$('#gf').onclick=click}
function paint(){document.querySelectorAll('.c').forEach(function(b){var S=b.dataset.g==='p'?P:F,v=S[b.dataset.t][+b.dataset.i];b.classList.toggle('a',v===1);b.classList.toggle('a2',v===2)})}
function hl(si,fl){lastCells.forEach(function(b){b.classList.remove('cur')});lastCells=cols[fl?'f':'p'][si]||[];lastCells.forEach(function(b){b.classList.add('cur')})}

/* ---------- transitions ---------- */
function cl(){var b={};DR.forEach(function(t){b[t[0]]=P[t[0]].slice()});return b}
var FL=[
['Roulement de clap',function(b){[10,12,13,14].forEach(function(i){b.clap[i]=1});b.clap[15]=2}],
['Rafale de hats',function(b){for(var i=8;i<16;i++)b.ch[i]=i===15?0:1;b.oh[15]=2}],
['Kicks en doubles',function(b){b.kick[10]=1;b.kick[14]=1;b.kick[15]=2}],
['Coupure du kick',function(b){for(var i=8;i<16;i++){b.kick[i]=0;if(i>=12)b.ch[i]=1}b.clap[14]=1;b.clap[15]=2;b.oh[15]=1}],
['Shaker en rafale',function(b){for(var i=8;i<16;i++)b.sh[i]=i%4===0?2:1}],
['Variation aléatoire',function(b){['clap','ch','sh'].forEach(function(k){for(var i=8;i<16;i++)if(Math.random()<.55)b[k][i]=1});b.clap[15]=2}]];
function proposeFill(){
 var four=P.kick.filter(function(v){return v}).length>=4,pool=(four?[0,1,3,5]:[1,2,4,5]).filter(function(i){return i!==fillIdx});
 fillIdx=pool[Math.floor(Math.random()*pool.length)];var b=cl();FL[fillIdx][1](b);
 DR.forEach(function(t){F[t[0]]=b[t[0]]});$('#fn').textContent='Proposition : '+FL[fillIdx][0]+' (tu peux la modifier ci-dessous)';paint()}
function uiArm(){$('#af').textContent=armed?'Transition en attente…':'Jouer la transition'}

/* ---------- lecture ---------- */
function ensure(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();G=mk(ctx)}return ctx.resume()}
function aud(k,v){ensure();hit(G,ctx.currentTime+.02,k,v||1)}
function tick(){
 var sd=sdur(),sw=$('#sw').value/100,auto=+$('#auto').value;
 if(next<ctx.currentTime-.2)next=ctx.currentTime+.05;
 while(next<ctx.currentTime+.12){
  var si=step%16,t=next+((si%2)?sd*sw*.6:0);
  if(si===0){var fl=false;if(armed){fl=true;armed=false;uiArm()}else if(auto>0&&(barNum+1)%auto===0)fl=true;curFill=fl;curPat=fl?F:P;barNum++}
  playStep(G,t,si,curPat);
  (function(si,fl,dl){setTimeout(function(){if(playing)hl(si,fl)},dl)})(si,curFill,Math.max(0,(t-ctx.currentTime)*1000));
  next+=sd;step++}}
function start(){ensure().then(function(){step=0;barNum=0;next=ctx.currentTime+.08;playing=true;clearInterval(timer);timer=setInterval(tick,25);$('#play').textContent='Stop'})}
function stop(){playing=false;clearInterval(timer);$('#play').textContent='Lecture';lastCells.forEach(function(b){b.classList.remove('cur')});armed=false;uiArm();if(ctx)ctx.suspend()}
$('#play').onclick=function(){playing?stop():start()};
$('#af').onclick=function(){armed=!armed;uiArm();if(armed&&!playing)start()};
$('#pf').onclick=proposeFill;

/* ---------- réglages ---------- */
function ui(){$('#o-bpm').textContent=$('#bpm').value+' BPM';$('#o-sw').textContent=$('#sw').value+' %';$('#o-vol').textContent=$('#vol').value+' %'}
['bpm','sw','vol'].forEach(function(i){$('#'+i).oninput=function(){ui();if(G&&G.ctx===ctx)G.master.gain.value=$('#vol').value/100}});ui();
function tabs(){$('#tabs').innerHTML=Object.keys(DEF).map(function(n){return '<button data-n="'+n+'"'+(n===cur?' class="on"':'')+'>'+TABN[n]+'</button>'}).join('')}
$('#tabs').onclick=function(e){var n=e.target.dataset.n;if(n){cur=n;tabs();panel()}};
function panel(){
 var n=cur,h='<div class="ctl">';
 DEF[n].forEach(function(d){
  if(d[2]==='sel')h+='<label>'+d[1]+'<select data-k="'+d[0]+'">'+d[3].map(function(x,i){return '<option value="'+i+'"'+(K[n][d[0]]===i?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label>';
  else h+='<label>'+d[1]+' <output>'+K[n][d[0]]+' '+d[5]+'</output><input type="range" data-k="'+d[0]+'" data-u="'+d[5]+'" min="'+d[2]+'" max="'+d[3]+'" step="'+(d[6]||1)+'" value="'+K[n][d[0]]+'"></label>'});
 $('#pan').innerHTML=h+'</div>';
 $('#pan').oninput=function(e){var t=e.target;if(!t.dataset.k)return;K[n][t.dataset.k]=+t.value;if(t.tagName==='INPUT')t.parentNode.querySelector('output').textContent=t.value+' '+t.dataset.u};
 $('#pan').onchange=function(e){if(e.target.dataset.k)audition(n)}}
function audition(n){if(playing)return;aud(n==='mod'?'kick':n,1)}
$('#prv').onclick=function(){audition(cur)};
$('#prst').onclick=function(){DEF[cur].forEach(function(d){K[cur][d[0]]=d[4]});panel();audition(cur)};
$('#prand').onclick=function(){
 DEF[cur].forEach(function(d){if(d[0]==='lvl')return;
  if(d[2]==='sel')K[cur][d[0]]=Math.floor(Math.random()*d[3].length);
  else{var s=d[6]||1,v=d[2]+Math.random()*(d[3]-d[2]);K[cur][d[0]]=+(Math.round(v/s)*s).toFixed(2)}});
 panel();audition(cur)};
function load(n){DR.forEach(function(t){P[t[0]]=parse(PRE[n][t[0]])});proposeFill()}
$('#pre').onchange=function(){load(this.value)};
$('#clr').onclick=function(){DR.forEach(function(t){P[t[0]]=P[t[0]].map(function(){return 0})});proposeFill()};
$('#rnd').onclick=function(){var d=function(q){return Math.random()<q?1:0};
 P.kick=P.kick.map(function(_,i){return i%4===0?1:d(i%2===0?.1:.12)});P.clap=P.clap.map(function(_,i){return i===4||i===12?1:0});
 P.ch=P.ch.map(function(_,i){return i%2===0?d(.8):d(.25)});P.oh=P.oh.map(function(_,i){return i%4===2?1:0});P.sh=P.sh.map(function(){return d(.5)});proposeFill()};

/* ---------- export ---------- */
function wav(buf){var n=buf.length,b=new ArrayBuffer(44+n*4),v=new DataView(b),L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L,i,q=44;

function crc(u){var c,t=crc.t;if(!t){t=crc.t=[];for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}var r=-1;for(var i=0;i<u.length;i++)r=t[(r^u[i])&255]^(r>>>8);return(r^-1)>>>0}

 h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,cr,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);parts.push(h,nm,d);
 var c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,cr,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);cd.push(c,nm);cs+=46+nm.length;off+=30+nm.length+d.length});
 var e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,fs.length,true);e.setUint16(10,fs.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);return new Blob(parts.concat(cd,[e]),{type:'application/zip'})}
function render(only){var sd=sdur(),sw=$('#sw').value/100,OC=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new OC(2,Math.ceil(44100*(64*sd+1.5)),44100),g=mk(oc,!!only);g.only=only;g.det=true;
 for(var s=0;s<64;s++){var si=s%16;playStep(g,s*sd+((si%2)?sd*sw*.6:0),si,s>=48?F:P)}
 return oc.startRendering().then(function(r){return wav(r).arrayBuffer()})}
function used(k){return P[k].some(function(v){return v})||F[k].some(function(v){return v})}
function vlq(n){var b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b}

function mid(){var bp=+$('#bpm').value,sw=$('#sw').value/100,T=120,tr={},cfg={kick:[36,60],clap:[39,60],ch:[42,40],oh:[46,100],sh:[70,40]};
 DR.forEach(function(t){tr[t[0]]=[]});

  DR.forEach(function(x){var k=x[0],st=pat[k][si];if(!st)return;var vel=st===2?127:100;tr[k].push([tk,1,9,cfg[k][0],vel]);tr[k].push([tk+cfg[k][1],0,9,cfg[k][0],0])})}

 Object.keys(tr).forEach(function(k){var ev=tr[k];if(!ev.length)return;ev.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
